name: Amostras de voz

on:
  workflow_dispatch:
  pull_request:
    paths: ["scripts/amostras-voz.py"]

permissions:
  contents: write

jobs:
  amostras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts==7.3.1
      - name: Gerar amostras
        run: python scripts/amostras-voz.py
      - name: Salvar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add amostras-voz
          git commit -m "Amostras de voz [skip ci]" || exit 0
          git pull --rebase -q
          git push
