name: Estudar canais de referência

on:
  workflow_dispatch:
  pull_request:
    paths: ["pedidos/referencias.json", "scripts/estudar-referencias.py", ".github/workflows/referencias.yml"]

permissions:
  contents: write

jobs:
  estudar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          pip install -U yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
      - name: Estudar vídeos mais vistos
        run: python scripts/estudar-referencias.py
      - name: Salvar resultado no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add referencias
          git commit -m "Estudo dos canais de referência [skip ci]" || exit 0
          git push
